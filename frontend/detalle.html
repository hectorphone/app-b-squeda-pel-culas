<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de película</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
    <main class="container my-4">
        <a href="index.html" class="btn btn-secondary mb-3">
            Volver al buscador
        </a>

        <p id="mensaje" role="status"></p>

        <section id="detalle" class="row" hidden>
            <div class="col-md-4">
                <img id="cartel" class="img-fluid" alt="" hidden>
            </div>

            <div class="col-md-8">
                <h1 id="titulo"></h1>

                <p>
                    <strong>Año:</strong>
                    <span id="anio"></span>
                </p>

                <p>
                    <strong>Director:</strong>
                    <span id="director"></span>
                </p>

                <p>
                    <strong>Actores:</strong>
                    <span id="actores"></span>
                </p>

                <h2 class="h4">Sinopsis</h2>
                <p id="sinopsis"></p>
            </div>
        </section>
        <section id="seccionComentarios" class="mt-4" hidden>
            <h2>Comentarios</h2>
            <p id="mensajeComentarios" role="status"></p>
            <div id="comentarios"></div>
            <h3 class="h4 mt-4">Añadir un comentario</h3>

            <form id="formComentario">
                <div class="mb-3">
                    <label for="persona" class="form-label">
                        Tu nombre
                    </label>
                    <input
                        type="text"
                        id="persona"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="comentario" class="form-label">
                        Tu comentario
                    </label>
                    <textarea
                        id="comentario"
                        class="form-control"
                        rows="3"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar comentario
                </button>
            </form>

            <p id="mensajeGuardar" class="mt-3" role="status"></p>
        </section>
    </main>

    <script src="js/detalle.js"></script>
</body>
</html>
